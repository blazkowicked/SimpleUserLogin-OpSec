<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a new password · OpSec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="Theme.css" />
  </head>
  <body class="ops">
    <div class="bg-grid" aria-hidden="true"></div>
    <canvas class="bg-network" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>

    <header class="brand">
      <span class="wordmark">OpSec</span>
    </header>

    <main class="card">
      <div class="card-header">
        <h1>Choose a new password</h1>
        <p class="subtitle">An admin set a temporary password, so you need to choose your own</p>
      </div>

      <form id="forceChangeForm" novalidate>
        <div class="field">
          <label for="changePassword">New password</label>
          <div class="input-wrap password-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input id="changePassword" type="password" required autocomplete="new-password" placeholder="New password" />
            <button type="button" class="eye-btn" data-eye="changePassword" aria-label="Show password"></button>
          </div>
        </div>
        <div class="field">
          <label for="changeConfirmPassword">Confirm new password</label>
          <div class="input-wrap password-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input id="changeConfirmPassword" type="password" required autocomplete="new-password" placeholder="Confirm new password" />
            <button type="button" class="eye-btn" data-eye="changeConfirmPassword" aria-label="Show password"></button>
          </div>
        </div>

        <div id="changeError" class="error" aria-live="polite"></div>
        <button type="submit" class="btn-primary">Save and continue</button>
      </form>

    </main>

    <footer class="site-footer">ITC 303 · Estallo, Cabic, Resultay</footer>

    <script src="background.js"></script>
    <script src="index.js"></script>
  </body>
</html>
