<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email · OpSec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="Theme.css" />
  </head>
  <body class="ops">
    <div class="bg-grid" aria-hidden="true"></div>
    <canvas class="bg-network" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>

    <header class="brand">
      <span class="wordmark">OpSec</span>
    </header>

    <main class="card">
      <div class="card-header">
        <h1>Check your email</h1>
        <p class="subtitle" id="otpSubtitle">Enter the 6-digit code we sent you</p>
      </div>

      <form id="otpForm" novalidate>
        <div class="field">
          <span class="field-label" id="otpLabel">Verification code</span>
          <!-- One box per digit; index.js builds them to match the code length -->
          <div class="otp-boxes" id="otpBoxes" role="group" aria-labelledby="otpLabel" data-length="6"></div>
        </div>

        <div id="otpError" class="error" aria-live="polite"></div>
        <div id="otpHint" class="hint" aria-live="polite"></div>
        <button type="submit" class="btn-primary">Verify</button>
      </form>

      <p class="switch">
        Didn't get it? <a href="#" id="otpResend">Resend code</a>
      </p>
    </main>

    <footer class="site-footer">ITC 303 · Estallo, Cabic, Resultay</footer>

    <script src="background.js"></script>
    <script src="index.js"></script>
  </body>
</html>
