<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin sign in · OpSec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="Theme.css" />
  </head>
  <body class="ops">
    <div class="bg-grid" aria-hidden="true"></div>
    <canvas class="bg-network" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>

    <header class="brand">
      <span class="wordmark">OpSec</span>
      <span class="brand-tag">Admin</span>
    </header>

    <main class="card">
      <div class="card-header">
        <h1>Sign in to OpSec admin</h1>
        <p class="subtitle">Administrator accounts only</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="field">
          <label for="adminEmail">Email</label>
          <div class="input-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input id="adminEmail" type="email" required autocomplete="email" placeholder="admin@example.com" />
          </div>
        </div>
        <div class="field">
          <label for="adminPassword">Password</label>
          <div class="input-wrap password-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input id="adminPassword" type="password" required autocomplete="current-password" placeholder="Password" />
            <button type="button" class="eye-btn" data-eye="adminPassword" aria-label="Show password"></button>
          </div>
        </div>

        <div id="adminLoginError" class="error" aria-live="polite"></div>
        <div id="adminHint" class="hint" aria-live="polite"></div>
        <button type="submit" class="btn-primary">Log in as admin</button>
      </form>

      <p class="switch">
        Not an admin? <a href="LoginPage.html">User login</a>
      </p>
    </main>

    <footer class="site-footer">ITC 303 · Estallo, Cabic, Resultay</footer>

    <script src="background.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("adminLoginForm");
        const errorEl = document.getElementById("adminLoginError");
        const ADMIN_TOKEN_KEY = "adminToken";
        const ADMIN_USER_KEY = "adminUser";

        function showError(msg) {
          if (errorEl) errorEl.textContent = msg || "";
        }
        function setLoading(btn, loading) {
          if (!btn) return;
          btn.disabled = loading;
          btn.dataset.orig ||= btn.textContent;
          btn.textContent = loading ? "Please wait..." : btn.dataset.orig;
        }
        async function api(path, opts = {}) {
          const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
          const { headers: _h, ...rest } = opts;
          const res = await fetch(path, { ...rest, headers });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.message || `Request failed (${res.status})`);
          return data;
        }

        const eyeSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3.2"/></svg>`;
        const eyeOffSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.93 10.93 0 0 1 12 19c-7 0-11-7-11-7a20.77 20.77 0 0 1 5.06-5.94"/><path d="M9.59 9.59A3.2 3.2 0 0 0 12 15.2a3.2 3.2 0 0 0 3.2-3.2 3.18 3.18 0 0 0-.59-1.81"/><path d="M1 1l22 22"/><path d="M10.58 10.58A3.2 3.2 0 0 0 14.42 14.42"/><path d="M14.12 14.12A3.2 3.2 0 0 1 9.88 9.88"/></svg>`;
        document.querySelectorAll(".eye-btn[data-eye]").forEach((btn) => {
          const input = document.getElementById(btn.getAttribute("data-eye"));
          if (!input) return;
          btn.innerHTML = eyeSvg;
          btn.addEventListener("click", () => {
            const isPw = input.type === "password";
            input.type = isPw ? "text" : "password";
            btn.innerHTML = isPw ? eyeOffSvg : eyeSvg;
          });
        });

        // If already logged in as admin, go to dashboard
        const existing = localStorage.getItem(ADMIN_TOKEN_KEY);
        if (existing) {
          // optional silent verification could be added, but just redirect
        }

        if (form) {
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            showError("");
            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value;
            if (!email || !password) {
              showError("Email and password are required");
              return;
            }
            const btn = form.querySelector("button[type=submit]");
            setLoading(btn, true);
            try {
              const data = await api("/api/admin/login", {
                method: "POST",
                body: JSON.stringify({ email, password }),
              });
              if (data.token) localStorage.setItem(ADMIN_TOKEN_KEY, data.token);
              if (data.admin?.email) localStorage.setItem(ADMIN_USER_KEY, data.admin.email);
              window.location.href = "AdminDashboard.html";
            } catch (err) {
              showError(err.message);
            } finally {
              setLoading(btn, false);
            }
          });
        }
      });
    </script>
  </body>
</html>
