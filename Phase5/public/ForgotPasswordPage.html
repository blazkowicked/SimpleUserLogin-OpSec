<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password · OpSec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="Theme.css" />
  </head>
  <body class="ops">
    <div class="bg-grid" aria-hidden="true"></div>
    <canvas class="bg-network" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>

    <header class="brand">
      <span class="wordmark">OpSec</span>
    </header>

    <main class="card">
      <div class="card-header">
        <h1>Forgot your password?</h1>
        <p class="subtitle">We'll email you a link to reset it</p>
      </div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="forgotEmail">Email</label>
          <div class="input-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input id="forgotEmail" type="email" required autocomplete="email" placeholder="you@example.com" />
          </div>
        </div>

        <div class="captcha" id="forgotCaptcha" aria-label="Human verification"></div>
        <div id="forgotError" class="error" aria-live="polite"></div>
        <div id="forgotHint" class="hint" aria-live="polite"></div>
        <button type="submit" class="btn-primary">Send reset link</button>
      </form>

      <p class="switch">
        Remembered it? <a href="LoginPage.html">Log in</a>
      </p>
    </main>

    <footer class="site-footer">ITC 303 · Estallo, Cabic, Resultay</footer>

    <script src="background.js"></script>
    <script src="email-check.js"></script>
    <script src="turnstile.js"></script>
    <script src="index.js"></script>
  </body>
</html>
