<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPSEC Login</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to Continue</p>

      <form id="loginForm" novalidate>
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required autocomplete="email" />

        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" required autocomplete="current-password" />
          <button type="button" class="eye-btn" data-eye="loginPassword" aria-label="Show password"></button>
        </div>

        <div id="loginError" class="error" aria-live="polite"></div>
        <div id="loginHint" class="hint" aria-live="polite"></div>
        <button type="submit">Login</button>
      </form>

      <p class="switch">
        Don't have an account? <a href="SignupPage.html">Sign up</a>
      </p>
    </div>

    <script src="index.js"></script>
  </body>
</html>
